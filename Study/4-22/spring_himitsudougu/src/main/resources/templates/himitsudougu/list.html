<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/head :: head_fragment(title = 'ひみつ道具情報一覧', scripts = ~{::script}, links = ~{::link})"></head>
<body>
  <div class="container">
    <h1>ひみつ道具情報一覧</h1>
    <div class="float-end">
      <a th:href="@{/himitsudougu/add}" class="btn btn-primary">新規登録はこちら</a>
    </div>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>名前</th>
          <th>説明</th>
          <th>特徴</th>
          <th>更新日時</th>
          <th>登録日時</th>
          <th>削除日時</th>
          <th></th> 
        </tr>
      </thead>
      <tbody>
        <tr th:each="himitsudougu : ${himitsudougulist}" th:object="${himitsudougu}" class="align-middle">
          <td th:text="*{id}"></td>
          <td th:text="*{name}"></td>
          <td th:text="*{explanation}"></td>
          <td th:text="*{feature}"></td>
          <td th:text="${#dates.format(himitsudougu.updateDate, 'yyyy/MM/dd')}"></td>
          <td th:text="${#dates.format(himitsudougu.createDate, 'yyyy/MM/dd')}"></td>
          <td th:text="${himitsudougu.deletedAt != null ? #dates.format(himitsudougu.deletedAt, 'yyyy/MM/dd') : ''}"></td>
          <td>
            <a th:href="@{/himitsudougu/{id}(id=*{id})}" class="btn btn-secondary">詳細</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
